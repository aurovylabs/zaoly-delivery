# Build the production app image and publish to GHCR for the delivery pack.
# Delivery compose pulls ghcr.io/chbrdk/zaoly (paths.deliveryContainerImage).
# Knowledge: knowledge/zaoly-delivery-repo.md

name: Publish delivery image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chbrdk/zaoly

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_PLAYWRIGHT=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Listing container packages for actor ${{ github.actor }}…"
          gh api "/user/packages?package_type=container" --jq '.[].name' || true
          # Package name is the image name after the owner (zaoly), URL-encoded if needed.
          for path in \
            "/user/packages/container/zaoly/visibility" \
            "/users/chbrdk/packages/container/zaoly/visibility"
          do
            if gh api --method PATCH -H "Accept: application/vnd.github+json" "$path" -f visibility=public; then
              echo "Set public via $path"
              exit 0
            fi
          done
          echo "::warning::Could not set GHCR package public via API. Set visibility manually: https://github.com/users/chbrdk/packages/container/package/zaoly"
